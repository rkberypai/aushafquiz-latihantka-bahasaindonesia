<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz TKA Bahasa Indonesia SD</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Quicksand:wght@400;600;700&display=swap');
        :root {
            --primary: #28a745;
            --secondary: #ffc107;
            --bg: #f4f8f4;
            --text: #333;
            --card-bg: #ffffff;
        }
        body {
            font-family: 'Quicksand', sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            width: 100%;
            max-width: 750px;
            background: var(--card-bg);
            border-radius: 20px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.1);
            padding: 30px;
            box-sizing: border-box;
        }
        .text-center { text-align: center; }
        .logo { max-width: 120px; margin-bottom: 15px; }
        h1, h2, h3 { color: var(--primary); }
        .form-group { margin-bottom: 20px; text-align: left; }
        label { font-weight: 600; display: block; margin-bottom: 8px; }
        input[type="text"] {
            width: 100%; padding: 12px; border: 2px solid #ddd;
            border-radius: 10px; font-size: 1.1em; box-sizing: border-box; font-family: inherit;
        }
        input[type="text"]:focus { border-color: var(--primary); outline: none; }
        button {
            background-color: var(--primary); color: white; border: none;
            padding: 12px 24px; border-radius: 10px; font-size: 1.1em;
            cursor: pointer; font-family: inherit; font-weight: 700;
            transition: transform 0.2s, background 0.2s; margin-top: 10px;
        }
        button:hover { background-color: #218838; transform: scale(1.02); }
        button:disabled { background-color: #ccc; cursor: not-allowed; transform: none; }
        .submit-btn { background-color: #007bff; }
        .submit-btn:hover { background-color: #0069d9; }
        .hidden { display: none !important; }
        .progress-container { margin-bottom: 20px; }
        .progress-bar { width: 100%; background: #e9ecef; border-radius: 10px; height: 12px; overflow: hidden; }
        .progress-fill { width: 0%; height: 100%; background: var(--secondary); transition: width 0.3s; }
        .question-text { font-size: 1.25em; margin-bottom: 20px; font-weight: 700; line-height: 1.5; color: #2c3e50;}
        .cerita { background: #fff3cd; padding: 15px; border-radius: 10px; margin-bottom: 20px; font-style: italic; border-left: 5px solid var(--secondary); font-size: 1.1em;}
        .options { display: flex; flex-direction: column; gap: 12px; }
        .option-label {
            background: #f8f9fa; padding: 15px; border-radius: 10px; border: 2px solid #eee;
            cursor: pointer; transition: all 0.2s; display: flex; align-items: center; font-size: 1.1em;
        }
        .option-label:hover { border-color: var(--primary); background: #eafaf1; }
        .option-label input { margin-right: 15px; transform: scale(1.4); cursor: pointer; }
        .bs-table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 1.1em;}
        .bs-table th, .bs-table td { border: 1px solid #ddd; padding: 12px; text-align: center; }
        .bs-table th { background-color: #f8f9fa; }
        .bs-table td:first-child { text-align: left; width: 65%; }
        .bs-table input { transform: scale(1.4); cursor: pointer; }
        .nav-buttons { display: flex; justify-content: space-between; margin-top: 30px; }
        .result-score { font-size: 5em; font-weight: 700; margin: 20px 0; color: var(--primary); }
        .status { font-size: 1.5em; font-weight: 700; padding: 10px 30px; border-radius: 15px; display: inline-block; margin-bottom: 20px; }
        .tuntas { background: #d4edda; color: #155724; }
        .belum-tuntas { background: #f8d7da; color: #721c24; }
        .info-table { width: 100%; max-width: 400px; margin: 0 auto 20px; text-align: left; font-size: 1.2em; }
        .info-table td { padding: 5px; }
        .type-badge { display: inline-block; background-color: #e9ecef; padding: 4px 10px; border-radius: 5px; font-size: 0.85em; font-weight: 600; color: #495057; margin-bottom: 10px; }
        @media (max-width: 600px) {
            .bs-table td:first-child { font-size: 0.95em; }
            .option-label { font-size: 1em; padding: 12px; }
            button { padding: 10px 20px; font-size: 1em; }
        }
    </style>
</head>
<body>

<div class="container">
    <!-- SCREEN LOGIN -->
    <div id="login-screen" class="text-center">
        <img src="466145747_542216861854199_4731265853630591024_n-removebg-preview.png" alt="Logo Pelita Aushaf" class="logo">
        <h2>Quiz TKA Interaktif</h2>
        <p style="font-size: 1.1em;">Mata Pelajaran: <strong>Bahasa Indonesia</strong><br>Jenjang: <strong>SD</strong></p>
        <div class="form-group">
            <label for="student-name">Nama Lengkap:</label>
            <input type="text" id="student-name" placeholder="Masukkan nama kamu..." required>
        </div>
        <div class="form-group">
            <label for="student-class">Kelas:</label>
            <input type="text" id="student-class" placeholder="Contoh: 5A" required>
        </div>
        <button onclick="startQuiz()" style="width: 100%; padding: 15px; font-size: 1.2em;">Mulai Quiz</button>
    </div>

    <!-- SCREEN QUIZ -->
    <div id="quiz-screen" class="hidden">
        <div class="progress-container">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
                <h3 id="question-counter" style="margin: 0; font-size: 1.2em; color: #555;">Soal 1 / 50</h3>
            </div>
            <div class="progress-bar">
                <div class="progress-fill" id="progress-bar-fill"></div>
            </div>
        </div>
        <div id="question-container"></div>
        <div class="nav-buttons">
            <button id="btn-prev" onclick="prevQuestion()" style="background-color: #6c757d;">Sebelumnya</button>
            <button id="btn-next" onclick="nextQuestion()">Berikutnya</button>
        </div>
    </div>

    <!-- SCREEN RESULT -->
    <div id="result-screen" class="hidden text-center">
        <img src="466145747_542216861854199_4731265853630591024_n-removebg-preview.png" alt="Logo Pelita Aushaf" class="logo" style="max-width: 90px;">
        <h2>Hasil Quiz</h2>
        <table class="info-table">
            <tr><td>Nama</td><td>: <strong id="res-name"></strong></td></tr>
            <tr><td>Kelas</td><td>: <strong id="res-class"></strong></td></tr>
            <tr><td>KKM</td><td>: <strong>70</strong></td></tr>
        </table>
        <div class="result-score" id="res-score">100</div>
        <div id="res-status" class="status tuntas">TUNTAS</div>
        <br>
        <button onclick="restartQuiz()" style="background-color: #17a2b8; padding: 12px 30px;">Ulangi Quiz</button>
    </div>
</div>

but...", "options": ["Protagonis", "Antagonis", "Tritagonis", "Figuran"], "answer": "Protagonis"}, {"type": "pg", "question": "Bagian awal dari sebuah karangan atau cerita disebut...", "options": ["Pendahuluan", "Isi", "Penutup", "Kesimpulan"], "answer": "Pendahuluan"}, {"type": "pg", "question": "Lawan kata dari 'panjang' adalah...", "options": ["Pendek", "Tinggi", "Besar", "Lebar"], "answer": "Pendek"}, {"type": "pg", "cerita": "Andi lupa membawa pensil saat ujian. Siti yang duduk di sebelahnya meminjamkan salah satu pensilnya.", "question": "Amanat yang dapat diambil dari kejadian di atas adalah...", "options": ["Kita harus saling tolong menolong", "Kita tidak perlu membawa pensil", "Siti sangat kaya", "Andi anak yang pelupa"], "answer": "Kita harus saling tolong menolong"}, {"type": "pg", "question": "Contoh kalimat perintah yang benar adalah...", "options": ["Tutuplah pintu itu!", "Apakah pintu itu tertutup?", "Pintu itu tertutup rapat.", "Siapa yang menutup pintu?"], "answer": "Tutuplah pintu itu!"}, {"type": "pg", "question": "Kata dasar dari 'menyayangi' adalah...", "options": ["Sayang", "Menyayang", "Sayangi", "Nyayang"], "answer": "Sayang"}, {"type": "pg", "question": "Tanda baca yang digunakan pada akhir kalimat tanya adalah...", "options": ["Tanda tanya (?)", "Tanda seru (!)", "Titik (.)", "Koma (,)"], "answer": "Tanda tanya (?)"}, {"type": "pg", "cerita": "Sinar matahari pagi menyelinap dari balik jendela kamarku. Burung-burung berkicau riang menyambut hari baru.", "question": "Latar waktu pada paragraf tersebut adalah...", "options": ["Pagi hari", "Siang hari", "Sore hari", "Malam hari"], "answer": "Pagi hari"}, {"type": "pg", "question": "Ungkapan 'bintang kelas' berarti...", "options": ["Murid terpandai", "Murid paling nakal", "Murid paling malas", "Ketua kelas"], "answer": "Murid terpandai"}, {"type": "pg", "question": "Karangan yang terikat oleh bait, baris, dan rima disebut...", "options": ["Puisi", "Prosa", "Dongeng", "Fabel"], "answer": "Puisi"}, {"type": "pg", "question": "Cerita yang tokohnya adalah hewan yang bertingkah laku seperti manusia disebut...", "options": ["Fabel", "Legenda", "Mitos", "Sage"], "answer": "Fabel"}, {"type": "pg", "question": "Pesan moral yang ingin disampaikan pengarang dalam cerita disebut...", "options": ["Amanat", "Tema", "Alur", "Latar"], "answer": "Amanat"}, {"type": "pgk", "question": "Manakah di bawah ini yang termasuk jenis-jenis paragraf berdasarkan letak kalimat utamanya? (Pilih lebih dari satu)", "options": ["Deduktif", "Induktif", "Deskriptif", "Naratif"], "answer": ["Deduktif", "Induktif"]}, {"type": "pgk", "question": "Ciri-ciri pantun yang benar adalah... (Pilih lebih dari satu)", "options": ["Satu bait terdiri dari 4 baris", "Bersajak a-b-a-b", "Baris pertama dan kedua adalah isi", "Baris ketiga dan keempat adalah sampiran"], "answer": ["Satu bait terdiri dari 4 baris", "Bersajak a-b-a-b"]}, {"type": "pgk", "question": "Pilihlah kalimat yang merupakan tanggapan positif! (Pilih lebih dari satu)", "options": ["Menurutku, lukisanmu sangat indah dan penuh makna.", "Saya setuju dengan pendapatmu karena itu sangat logis.", "Karyamu sangat jelek dan tidak berguna.", "Ide itu sama sekali tidak masuk akal."], "answer": ["Menurutku, lukisanmu sangat indah dan penuh makna.", "Saya setuju dengan pendapatmu karena itu sangat logis."]}, {"type": "pgk", "question": "Unsur intrinsik dalam sebuah cerita meliputi... (Pilih lebih dari satu)", "options": ["Tema", "Tokoh dan Penokohan", "Latar belakang pengarang", "Penerbit buku"], "answer": ["Tema", "Tokoh dan Penokohan"]}, {"type": "pgk", "question": "Manakah yang termasuk contoh kata sifat? (Pilih lebih dari satu)", "options": ["Cantik", "Berlari", "Tinggi", "Meja"], "answer": ["Cantik", "Tinggi"]}, {"type": "pgk", "question": "Kata penghubung (konjungsi) yang menyatakan sebab akibat adalah... (Pilih lebih dari satu)", "options": ["Karena", "Sehingga", "Dan", "Atau"], "answer": ["Karena", "Sehingga"]}, {"type": "pgk", "question": "Bagian dari surat resmi yang tidak ada pada surat pribadi adalah... (Pilih lebih dari satu)", "options": ["Kop surat (Kepala surat)", "Nomor surat", "Tanggal surat", "Isi surat"], "answer": ["Kop surat (Kepala surat)", "Nomor surat"]}, {"type": "pgk", "question": "Pilihlah kalimat majemuk setara di bawah ini! (Pilih lebih dari satu)", "options": ["Budi membaca buku dan Ani menggambar.", "Ibu memasak di dapur sedangkan ayah mencuci motor.", "Karena hujan turun sangat deras, kami tidak pergi bermain.", "Jika saya lulus ujian, saya akan berlibur ke Bali."], "answer": ["Budi membaca buku dan Ani menggambar.", "Ibu memasak di dapur sedangkan ayah mencuci motor."]}, {"type": "pgk", "question": "Manakah yang termasuk contoh teks petunjuk (prosedur)? (Pilih lebih dari satu)", "options": ["Cara membuat layang-layang.", "Langkah-langkah mencuci tangan yang benar.", "Cerita Malin Kundang.", "Puisi tentang keindahan alam."], "answer": ["Cara membuat layang-layang.", "Langkah-langkah mencuci tangan yang benar."]}, {"type": "pgk", "question": "Yang termasuk jenis dongeng adalah... (Pilih lebih dari satu)", "options": ["Legenda", "Fabel", "Berita", "Jurnal ilmiah"], "answer": ["Legenda", "Fabel"]}, {"type": "pgk", "question": "Kata kerja berimbuhan 'me-kan' yang benar terdapat pada kata... (Pilih lebih dari satu)", "options": ["Menyanyikan", "Melakukan", "Membeli", "Menari"], "answer": ["Menyanyikan", "Melakukan"]}, {"type": "pgk", "question": "Contoh peribahasa beserta maknanya yang tepat adalah... (Pilih lebih dari satu)", "options": ["Bagai air di daun talas (orang yang tidak punya pendirian tetap).", "Ada gula ada semut (di mana ada kesenangan, di situ banyak orang datang).", "Air beriak tanda tak dalam (orang yang pendiam biasanya cerdas).", "Bagaikan pungguk merindukan bulan (cita-cita yang mudah diraih)."], "answer": ["Bagai air di daun talas (orang yang tidak punya pendirian tetap).", "Ada gula ada semut (di mana ada kesenangan, di situ banyak orang datang)."]}, {"type": "pgk", "question": "Manakah yang termasuk kalimat ajakan? (Pilih lebih dari satu)", "options": ["Mari kita jaga kebersihan lingkungan!", "Ayo bersihkan kelas bersama-sama!", "Tolong ambilkan buku itu!", "Jangan buang sampah sembarangan!"], "answer": ["Mari kita jaga kebersihan lingkungan!", "Ayo bersihkan kelas bersama-sama!"]}, {"type": "pgk", "question": "Sinonim kata yang tepat di bawah ini adalah... (Pilih lebih dari satu)", "options": ["Bohong = Dusta", "Bahagia = Senang", "Besar = Kecil", "Cepat = Lambat"], "answer": ["Bohong = Dusta", "Bahagia = Senang"]}, {"type": "pgk", "question": "Kata berawalan 'di-' yang menyatakan tempat (harus dipisah) adalah... (Pilih lebih dari satu)", "options": ["Di sekolah", "Di pasar", "Dimakan", "Dipukul"], "answer": ["Di sekolah", "Di pasar"]}, {"type": "bs", "question": "Tentukan Benar atau Salah pernyataan mengenai Dongeng dan Fabel berikut!", "statements": [{"text": "Fabel adalah dongeng yang tokoh utamanya adalah hewan yang bisa bicara.", "answer": "benar"}, {"text": "Dongeng Malin Kundang adalah contoh fabel.", "answer": "salah"}]}, {"type": "bs", "question": "Tentukan Benar atau Salah pernyataan mengenai Tanda Baca berikut!", "statements": [{"text": "Tanda titik (.) selalu digunakan untuk mengakhiri kalimat tanya.", "answer": "salah"}, {"text": "Tanda koma (,) digunakan untuk memisahkan rincian atau penyebutan.", "answer": "benar"}]}, {"type": "bs", "question": "Evaluasi penggunaan Huruf Kapital pada kalimat berikut!", "statements": [{"text": "'presiden Joko Widodo meresmikan jembatan baru.'", "answer": "salah"}, {"text": "'Adik lahir pada bulan Agustus.'", "answer": "benar"}]}, {"type": "bs", "question": "Tentukan Benar atau Salah pernyataan mengenai Ide Pokok berikut!", "statements": [{"text": "Ide pokok selalu berada di akhir paragraf.", "answer": "salah"}, {"text": "Setiap paragraf minimal memiliki satu ide pokok utama.", "answer": "benar"}]}, {"type": "bs", "question": "Tentukan Benar atau Salah pada arti ungkapan berikut!", "statements": [{"text": "Membanting tulang artinya bekerja keras.", "answer": "benar"}, {"text": "Panjang tangan artinya suka menolong.", "answer": "salah"}]}, {"type": "bs", "question": "Tentukan Benar atau Salah pada bentuk kata baku berikut!", "statements": [{"text": "'Jadwal' adalah kata baku.", "answer": "benar"}, {"text": "'Pebruari' adalah kata baku dari bulan kedua.", "answer": "salah"}]}, {"type": "bs", "question": "Tentukan Benar atau Salah mengenai ciri Puisi!", "statements": [{"text": "Puisi tidak memiliki rima atau sajak.", "answer": "salah"}, {"text": "Pilihan kata dalam puisi biasanya bermakna kiasan atau indah.", "answer": "benar"}]}, {"type": "bs", "question": "Tentukan Benar atau Salah tentang Imbuhan!", "statements": [{"text": "Awalan 'pe-' pada kata 'pelari' menunjukkan orang yang melakukan.", "answer": "benar"}, {"text": "Akhiran '-an' pada kata 'makanan' menunjukkan kata kerja.", "answer": "salah"}]}, {"type": "bs", "question": "Tentukan Benar atau Salah penggunaan Kata Depan 'di' dan 'ke'!", "statements": [{"text": "'Kemana' seharusnya ditulis 'Ke mana'.", "answer": "benar"}, {"text": "'Dibuang' seharusnya ditulis 'Di buang'.", "answer": "salah"}]}, {"type": "bs", "question": "Tentukan Benar atau Salah pada pernyataan tentang Teks Prosedur!", "statements": [{"text": "Teks prosedur berisi langkah-langkah atau tahapan melakukan sesuatu.", "answer": "benar"}, {"text": "Teks prosedur biasanya bertujuan untuk mengkritik pembaca.", "answer": "salah"}]}, {"type": "bs", "question": "Tentukan Benar atau Salah arti Peribahasa berikut!", "statements": [{"text": "'Berakit-rakit ke hulu, berenang-renang ke tepian' artinya bersusah-susah dahulu bersenang-senang kemudian.", "answer": "benar"}, {"text": "'Tong kosong nyaring bunyinya' artinya orang yang pintar biasanya banyak bicara.", "answer": "salah"}]}, {"type": "bs", "question": "Tentukan Benar atau Salah kalimat efektif berikut!", "statements": [{"text": "'Para hadirin sekalian dimohon berdiri.' adalah kalimat yang efektif.", "answer": "salah"}, {"text": "'Hadirin dimohon berdiri.' adalah kalimat yang efektif.", "answer": "benar"}]}, {"type": "bs", "question": "Tentukan Benar atau Salah mengenai Antonim!", "statements": [{"text": "Antonim dari kata 'gelap' adalah 'terang'.", "answer": "benar"}, {"text": "Antonim dari kata 'mahal' adalah 'mewah'.", "answer": "salah"}]}, {"type": "bs", "question": "Tentukan Benar atau Salah mengenai Sinonim!", "statements": [{"text": "Sinonim dari 'baju' adalah 'pakaian'.", "answer": "benar"}, {"text": "Sinonim dari 'haus' adalah 'lapar'.", "answer": "salah"}]}, {"type": "bs", "question": "Tentukan Benar atau Salah pernyataan tentang Surat!", "statements": [{"text": "Surat undangan ulang tahun termasuk surat resmi.", "answer": "salah"}, {"text": "Surat izin sakit dari wali murid ke guru sekolah termasuk surat pribadi yang bersifat resmi.", "answer": "benar"}]}];
let currentQuestionIndex = 0;
let userAnswers = {};

function shuffleArray(array) {
    for (let i = array.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [array[i], array[j]] = [array[j], array[i]];
    }
}

function shuffleQuestions() {
    shuffleArray(questions);
    questions.forEach(q => {
        if (q.type === 'pg' || q.type === 'pgk') {
            shuffleArray(q.options);
        }
    });
}

function startQuiz() {
    const name = document.getElementById('student-name').value.trim();
    const kelas = document.getElementById('student-class').value.trim();
    if (!name || !kelas) {
        alert('Mohon isi Nama dan Kelas terlebih dahulu!');
        return;
    }
    document.getElementById('login-screen').classList.add('hidden');
    document.getElementById('quiz-screen').classList.remove('hidden');
    renderQuestion();
    updateProgress();
}

function renderQuestion() {
    const q = questions[currentQuestionIndex];
    const container = document.getElementById('question-container');
    let html = '';

    if (q.type === 'pg') {
        html += `<span class="type-badge">Pilihan Ganda</span>`;
    } else if (q.type === 'pgk') {
        html += `<span class="type-badge">Pilihan Ganda Kompleks</span>`;
    } else if (q.type === 'bs') {
        html += `<span class="type-badge">Benar / Salah</span>`;
    }

    if (q.cerita) {
        html += `<div class="cerita">${q.cerita}</div>`;
    }
    html += `<div class="question-text">${currentQuestionIndex + 1}. ${q.question}</div>`;

    if (q.type === 'pg') {
        html += '<div class="options">';
        q.options.forEach((opt, idx) => {
            const checked = userAnswers[currentQuestionIndex] === opt ? 'checked' : '';
            html += `
            <label class="option-label">
                <input type="radio" name="q${currentQuestionIndex}" value="${opt}" onchange="saveAnswer('${opt}')" ${checked}>
                ${opt}
            </label>`;
        });
        html += '</div>';
    } else if (q.type === 'pgk') {
        html += '<div class="options"><small style="color:#e67e22; margin-bottom: 5px;"><i>Pilih lebih dari satu jawaban yang benar (Kotak Centang)</i></small>';
        const currentAns = userAnswers[currentQuestionIndex] || [];
        q.options.forEach((opt, idx) => {
            const checked = currentAns.includes(opt) ? 'checked' : '';
            html += `
            <label class="option-label">
                <input type="checkbox" value="${opt}" onchange="saveAnswerPGK(this)" ${checked}>
                ${opt}
            </label>`;
        });
        html += '</div>';
    } else if (q.type === 'bs') {
        html += '<table class="bs-table"><tr><th>Pernyataan</th><th>Benar</th><th>Salah</th></tr>';
        const currentAns = userAnswers[currentQuestionIndex] || {};
        q.statements.forEach((stmt, idx) => {
            const isBenar = currentAns[idx] === 'benar' ? 'checked' : '';
            const isSalah = currentAns[idx] === 'salah' ? 'checked' : '';
            html += `
            <tr>
                <td>${stmt.text}</td>
                <td><input type="radio" name="bs${currentQuestionIndex}_${idx}" value="benar" onchange="saveAnswerBS(${idx}, 'benar')" ${isBenar}></td>
                <td><input type="radio" name="bs${currentQuestionIndex}_${idx}" value="salah" onchange="saveAnswerBS(${idx}, 'salah')" ${isSalah}></td>
            </tr>`;
        });
        html += '</table>';
    }

    container.innerHTML = html;

    document.getElementById('btn-prev').disabled = currentQuestionIndex === 0;
    if (currentQuestionIndex === questions.length - 1) {
        document.getElementById('btn-next').innerText = 'Kumpulkan';
        document.getElementById('btn-next').classList.add('submit-btn');
    } else {
        document.getElementById('btn-next').innerText = 'Berikutnya';
        document.getElementById('btn-next').classList.remove('submit-btn');
    }
}

function saveAnswer(val) { userAnswers[currentQuestionIndex] = val; }

function saveAnswerPGK(checkbox) {
    if (!userAnswers[currentQuestionIndex]) userAnswers[currentQuestionIndex] = [];
    let arr = userAnswers[currentQuestionIndex];
    if (checkbox.checked) {
        if (!arr.includes(checkbox.value)) arr.push(checkbox.value);
    } else {
        arr = arr.filter(v => v !== checkbox.value);
    }
    userAnswers[currentQuestionIndex] = arr;
}

function saveAnswerBS(stmtIdx, val) {
    if (!userAnswers[currentQuestionIndex]) userAnswers[currentQuestionIndex] = {};
    userAnswers[currentQuestionIndex][stmtIdx] = val;
}

function nextQuestion() {
    if (currentQuestionIndex === questions.length - 1) {
        if (confirm('Apakah kamu yakin ingin mengumpulkan semua jawaban?')) {
            calculateScore();
        }
    } else {
        currentQuestionIndex++;
        renderQuestion();
        updateProgress();
    }
}

function prevQuestion() {
    if (currentQuestionIndex > 0) {
        currentQuestionIndex--;
        renderQuestion();
        updateProgress();
    }
}

function updateProgress() {
    const progress = ((currentQuestionIndex + 1) / questions.length) * 100;
    document.getElementById('progress-bar-fill').style.width = progress + '%';
    document.getElementById('question-counter').innerText = `Soal ${currentQuestionIndex + 1} / ${questions.length}`;
}

function calculateScore() {
    let totalCorrect = 0;
    questions.forEach((q, i) => {
        const ans = userAnswers[i];
        if (!ans) return;

        if (q.type === 'pg') {
            if (ans === q.answer) totalCorrect++;
        } else if (q.type === 'pgk') {
            const correctAns = q.answer;
            if (ans.length === correctAns.length && ans.every(v => correctAns.includes(v))) {
                totalCorrect++;
            }
        } else if (q.type === 'bs') {
            let allCorrect = true;
            q.statements.forEach((stmt, j) => {
                if (ans[j] !== stmt.answer) allCorrect = false;
            });
            // Pastikan semua pernyataan dijawab
            if (allCorrect && Object.keys(ans).length === q.statements.length) {
                totalCorrect++;
            }
        }
    });

    const finalScore = Math.round((totalCorrect / questions.length) * 100);
    showResult(finalScore);
}

function showResult(finalScore) {
    document.getElementById('quiz-screen').classList.add('hidden');
    document.getElementById('result-screen').classList.remove('hidden');

    document.getElementById('res-name').innerText = document.getElementById('student-name').value;
    document.getElementById('res-class').innerText = document.getElementById('student-class').value;
    document.getElementById('res-score').innerText = finalScore;

    const statusEl = document.getElementById('res-status');
    if (finalScore >= 70) {
        statusEl.innerText = 'TUNTAS 🎉';
        statusEl.className = 'status tuntas';
    } else {
        statusEl.innerText = 'BELUM TUNTAS 😔';
        statusEl.className = 'status belum-tuntas';
    }
}

function restartQuiz() {
    currentQuestionIndex = 0;
    userAnswers = {};
    shuffleQuestions();
    document.getElementById('result-screen').classList.add('hidden');
    document.getElementById('login-screen').classList.remove('hidden');
}

// Init shuffle on load
shuffleQuestions();
</script>
